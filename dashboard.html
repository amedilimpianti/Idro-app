<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dashboard — IDROPERATIVE</title>
<meta name="theme-color" content="#F4F6F5" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="dashboard">

<div class="mobile-topbar">
  <div class="brand">
    <div class="brand-mark" style="width:28px;height:28px;"><img src="icons/icon-192.png" alt="IDROPERATIVE" /></div>
    <div class="brand-text" style="font-size:14px;">IDRO<span>PERATIVE</span></div>
  </div>
  <div class="mobile-page-title" id="mobile-page-title">Dashboard</div>
  <a href="modalita-auto.html" class="mobile-topbar-auto-btn" title="Modalità Auto">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 11 6.5 6a2 2 0 0 1 2-1.5h7a2 2 0 0 1 2 1.5L19 11"/><rect x="3" y="11" width="18" height="6" rx="2"/><circle cx="7.5" cy="17" r="1.2"/><circle cx="16.5" cy="17" r="1.2"/></svg>
  </a>
</div>

<div class="app-shell">
  <aside class="sidenav">
    <div class="brand">
      <div class="brand-mark"><img src="icons/icon-192.png" alt="IDROPERATIVE" /></div>
      <div class="brand-text">IDRO<span>PERATIVE</span></div>
    </div>

    <div class="nav-group">
      <div class="nav-label">Operativo</div>
      <a class="nav-link" href="dashboard.html" data-nav="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a>
      <a class="nav-link" href="appuntamento.html" data-nav="nuovo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Nuovo intervento
      </a>
      <a class="nav-link" href="impostazioni.html" data-nav="impostazioni">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        Impostazioni
      </a>
      <a class="nav-link" href="modalita-auto.html" data-nav="auto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 11 6.5 6a2 2 0 0 1 2-1.5h7a2 2 0 0 1 2 1.5L19 11"/><rect x="3" y="11" width="18" height="6" rx="2"/><circle cx="7.5" cy="17" r="1.2"/><circle cx="16.5" cy="17" r="1.2"/></svg>
        Modalità Auto
      </a>
    </div>

    <div class="nav-footer">
      <div class="user-card">
        <div class="avatar" data-user-avatar>--</div>
        <div class="who">
          <div class="name" data-user-name>Caricamento…</div>
          <div class="role" data-user-role></div>
        </div>
      </div>
      <a href="#" class="nav-link logout-link" id="logout-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Esci
      </a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <span class="eyebrow">PANORAMICA INTERVENTI</span>
        <h1>Dashboard</h1>
      </div>
      <div class="topbar-actions">
        <a href="appuntamento.html" class="btn btn-primary">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M12 5v14M5 12h14"/></svg>
          Nuovo intervento
        </a>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-card accent"><div class="num" id="stat-today">–</div><div class="label">Interventi oggi</div></div>
      <div class="stat-card"><div class="num" id="stat-planned">–</div><div class="label">Pianificati</div></div>
      <div class="stat-card"><div class="num" id="stat-progress">–</div><div class="label">In corso</div></div>
      <div class="stat-card"><div class="num" id="stat-done">–</div><div class="label">Lavori effettuati</div></div>
    </div>

    <div class="card">
      <div class="filter-bar">
        <button type="button" class="btn btn-sm btn-primary" data-scope="day">Giorno</button>
        <button type="button" class="btn btn-sm btn-secondary" data-scope="week">Settimana</button>
        <button type="button" class="btn btn-sm btn-secondary" data-scope="all">Tutti</button>
        <input type="date" id="filter-date" />
        <button type="button" class="btn btn-sm btn-secondary filter-toggle-btn" id="filter-toggle-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3Z"/></svg>
          Filtri
        </button>
        <div class="filter-extra" id="filter-extra">
          <select id="filter-status">
            <option value="">Tutti gli stati</option>
            <option value="pianificato">Pianificato</option>
            <option value="in_corso">In corso</option>
            <option value="completato">Lavoro effettuato</option>
            <option value="da_ultimare">Da ultimare</option>
            <option value="rimandato">Rimandato</option>
            <option value="annullato">Annullato</option>
          </select>
          <div class="search-input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="filter-search" placeholder="Cerca cliente o indirizzo…" />
          </div>
        </div>
      </div>

      <div class="appt-list" id="appt-list">
        <div class="page-loader"><span class="spinner"></span> Caricamento interventi…</div>
      </div>
    </div>
  </main>
</div>

<nav class="bottom-nav">
  <a href="dashboard.html" data-nav="dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
    <span>Dashboard</span>
  </a>
  <a href="appuntamento.html" data-nav="nuovo" class="fab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    <span>Nuovo</span>
  </a>
  <a href="impostazioni.html" data-nav="impostazioni">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
    <span>Impostazioni</span>
  </a>
</nav>

<div id="toast-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/ui.js"></script>
<script src="js/appuntamenti.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById("logout-btn").addEventListener("click", (e) => { e.preventDefault(); logout(); });
</script>
</body>
</html>
